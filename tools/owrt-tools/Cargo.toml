[package]
name = "owrt-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false
description = "Host-only build, release, device-window and benchmark tooling; never shipped to a router"

[dependencies]
flate2 = "1"
libc = "0.2"
regex = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
toml = "0.8"
