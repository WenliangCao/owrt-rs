[package]
name = "owrt-reload-config"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Contract C1-01 compatible OpenWrt config change dispatcher"
publish = false

[dependencies]
owrt-uci = { path = "../uci" }
owrt-ubus = { path = "../ubus" }

[[bin]]
name = "reload-config-rs"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
