[package]
name = "owrt-rpcd"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Contract C5 compatible rpcd plugin-layer objects (file, luci) as a standalone ubus object server"
publish = false

[[bin]]
name = "rpcd-rs"
path = "src/main.rs"

[dependencies]
owrt-platform = { path = "../platform" }
rustix = { version = "=1.1.5", features = ["event", "fs", "net", "pipe", "process", "system", "time"] }
owrt-ubus = { path = "../ubus" }
owrt-uci = { path = "../uci" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
