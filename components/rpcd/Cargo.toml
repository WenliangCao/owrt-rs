[package]
name = "owrt-rpcd"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
description = "Contract C5 compatible rpcd plugin-layer objects (file, luci) as a standalone ubus object server"
publish = false

[[bin]]
name = "rpcd-rs"
path = "src/main.rs"

[dependencies]
owrt-ubus = { path = "../ubus" }
owrt-uci = { path = "../uci" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
