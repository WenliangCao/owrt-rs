[package]
name = "owrt-logd"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Contract C2 compatible OpenWrt system log daemon (logd replacement)"
publish = false

[[bin]]
name = "logd-rs"
path = "src/main.rs"

[dependencies]
owrt-platform = { path = "../platform" }
rustix = { version = "=1.1.5", features = ["event", "fs", "net", "pipe", "process", "stdio", "time"] }
owrt-ubus = { path = "../ubus" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
