[package]
name = "owrt-httpd"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Contract C3 compatible HTTP front end (uhttpd replacement): static files, CGI, /ubus JSON-RPC bridge, TLS"
publish = false

[[bin]]
name = "httpd-rs"
path = "src/main.rs"

[dependencies]
owrt-platform = { path = "../platform" }
rustix = { version = "=1.1.5", features = ["event", "fs", "net", "pipe", "process", "stdio", "time"] }
owrt-ubus = { path = "../ubus" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
