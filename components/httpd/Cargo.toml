[package]
name = "owrt-httpd"
version = "0.1.1"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
description = "Contract C3 compatible HTTP front end (uhttpd replacement): static files, CGI, /ubus JSON-RPC bridge, TLS"
publish = false

[[bin]]
name = "httpd-rs"
path = "src/main.rs"

[dependencies]
owrt-ubus = { path = "../ubus" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
