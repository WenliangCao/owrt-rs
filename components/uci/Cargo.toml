[package]
name = "owrt-uci"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Contract C6 compatible libuci read/write/delta semantics and the /sbin/uci CLI"
publish = false

[lib]
name = "owrt_uci"
path = "src/lib.rs"

[[bin]]
name = "uci-rs"
path = "src/bin/uci-rs.rs"

[dependencies]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
