[package]
name = "owrt-uci"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Contract C6 compatible libuci read/write/delta semantics and the /sbin/uci CLI"
publish = false

[lib]
name = "owrt_uci"
path = "src/lib.rs"

[[bin]]
name = "uci-rs"
path = "platform/entry.rs"

[dependencies]
owrt-platform = { path = "../platform" }
rustix = { version = "=1.1.5", features = ["event", "fs", "net", "pipe", "process", "stdio", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
