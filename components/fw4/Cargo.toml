[package]
name = "owrt-fw4"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Contract C4 compatible nftables ruleset generator (firewall4 replacement)"
publish = false

[[bin]]
name = "fw4-rs"
path = "src/main.rs"

[dependencies]
owrt-ubus = { path = "../ubus" }
owrt-uci = { path = "../uci" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
