[package]
name = "dnsmasq-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "GPL-2.0-only OR GPL-3.0-only"
description = "Rust implementation of the OpenWrt dnsmasq 2.93 nodhcpv6 contract"
publish = false

[features]
default = []
m6b-diagnostics = []
process-test-support = []

[dependencies]
owrt-ubus = { path = "../ubus" }
dnsmasq-platform = { path = "platform" }
rustix = { version = "=1.1.5", features = ["event", "fs", "mm", "net", "param", "pipe", "process", "stdio", "system", "thread", "time", "try_close"] }

[lib]
name = "dnsmasq_rs"
path = "src/lib.rs"

[[bin]]
name = "dnsmasq-rs"
path = "platform/entry.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[test]]
name = "process_forks"
path = "platform/tests/process_forks.rs"
harness = false
required-features = ["process-test-support"]

[[test]]
name = "process_owner"
path = "platform/tests/process_owner.rs"
harness = false
required-features = ["process-test-support"]
