[package]
name = "owrt-procd"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "procd replacement: service supervision, triggers and PID 1 (see docs/contracts/procd.md)"
publish = false

[features]
default = []
process-test-support = []

[[bin]]
name = "procd-rs"
path = "src/main.rs"

[dependencies]
owrt-ubus = { path = "../ubus" }
owrt-platform = { path = "../platform" }
rustix = { version = "=1.1.5", features = ["event", "fs", "mount", "net", "pipe", "process", "pty", "stdio", "system", "termios", "thread", "time", "try_close"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[[test]]
name = "process_owner"
path = "tests/process_owner.rs"
harness = false
required-features = ["process-test-support"]
