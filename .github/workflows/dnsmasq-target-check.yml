name: dnsmasq-target-check
on:
  push:
    branches: [main, ci/audit110-r3, research/dnsmasq-safe-v022-20261017, research/core-safe-20261017]
    paths:
      - "components/dnsmasq/**"
      - "components/ubus/**"
      - "components/platform/**"
      - "packaging/openwrt/owrt-dnsmasq/**"
      - "tools/ci_*dnsmasq*.py"
      - "tools/dnsmasq/**"
      - "tools/cargo.sh"
      - "tools/install_cargo.sh"
      - "rust-toolchain.toml"
      - ".github/workflows/dnsmasq-target-check.yml"
  pull_request:
    paths:
      - "components/dnsmasq/**"
      - "components/ubus/**"
      - "components/platform/**"
      - "packaging/openwrt/owrt-dnsmasq/**"
      - "tools/ci_*dnsmasq*.py"
      - "tools/dnsmasq/**"
      - "tools/cargo.sh"
      - "tools/install_cargo.sh"
      - "rust-toolchain.toml"
      - ".github/workflows/dnsmasq-target-check.yml"
  workflow_dispatch:
    inputs:
      spec:
        description: Optional committed PGO source freeze; empty builds checkout without PGO
        type: string
      stage:
        type: choice
        default: frozen-use
        options: [generate, candidate-use, frozen-use]

permissions:
  contents: read
  actions: read

concurrency:
  group: dnsmasq-target-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  target-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENWRT_VERSION: "25.12.6"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: pinned Rust toolchain
        id: rust
        env:
          SPEC: ${{ inputs.spec }}
        run: |
          if [ -n "$SPEC" ]; then
            channel=$(python3 tools/ci_dnsmasq_pgo_inputs.py toolchain --spec "$SPEC")
          else
            channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: aarch64-unknown-linux-musl
      - name: install verified huacnlee/cargo
        run: sh tools/install_cargo.sh
      - name: host packages for the unmodified x86 SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib gettext \
            libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file curl zstd
      - name: cache pinned SDK download only
        uses: actions/cache@v4
        with:
          path: work/dl
          key: dnsmasq-target-sdk-${{ hashFiles('manifests/release-*.json') }}
      - name: validate compiler-warning hard gate
        run: python3 -m unittest discover -s tools -p test_ci_dnsmasq_target.py
      - name: build current revision for OpenWrt and reject every compiler warning
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC: ${{ inputs.spec }}
          PGO_STAGE: ${{ inputs.stage }}
        run: |
          if [ -n "$SPEC" ]; then
            python3 tools/ci_check_dnsmasq_pgo_pipeline.py "$GITHUB_WORKSPACE/work" --spec "$SPEC" --stage "$PGO_STAGE"
          else
            python3 tools/ci_check_dnsmasq_target.py "$GITHUB_WORKSPACE/work"
          fi
      - name: preserve actual target artifacts and all build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnsmasq-target-${{ github.sha }}
          path: |
            work/out/dnsmasq/*.apk
            work/out/dnsmasq/dnsmasq-rs
            work/out/dnsmasq/*.log
            work/out/dnsmasq/*.json
            work/out/dnsmasq/source.tar
            work/out/dnsmasq/pgo/*
            work/out/dnsmasq/pgo-compilation/*
            work/out/dnsmasq/cargo-*.json*
          if-no-files-found: error
          retention-days: 90
