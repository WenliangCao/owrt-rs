name: dnsmasq-target-check
on:
  push:
    branches: [validation/dnsmasq-stage1-20261017]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dnsmasq-target-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  target-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: aarch64-unknown-linux-musl
      - name: host packages for the unmodified x86 SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib gettext \
            libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file curl zstd
      - name: cache pinned SDK download only
        uses: actions/cache@v4
        with:
          path: work/dl
          key: dnsmasq-target-sdk-ff4a38a397caa2cfe1c39e18f84ddede14878221b3593c3f2c4cfe24e3ec4c25
      - name: validate compiler-warning hard gate
        run: python3 -m unittest discover -s tools -p test_ci_dnsmasq_target.py
      - name: build frozen plain target and reject every compiler warning
        run: python3 tools/ci_check_dnsmasq_target.py "$GITHUB_WORKSPACE/work"
      - name: preserve actual target artifacts and all build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnsmasq-stage1-target-${{ github.sha }}
          path: |
            work/out/dnsmasq/*.apk
            work/out/dnsmasq/dnsmasq-rs
            work/out/dnsmasq/*.log
            work/out/dnsmasq/*.json
            work/out/dnsmasq/source.tar
          if-no-files-found: error
          retention-days: 90
