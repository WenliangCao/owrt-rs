name: dnsmasq-pgo-candidate
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Explicit canonical PGO stage
        required: true
        type: choice
        options: [generate, candidate-use, frozen-use]
      spec:
        description: Committed freeze for the final integrated source
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dnsmasq-pgo-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/an8855-dtb-trim'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install verified mr-boxington
        run: sh tools/install_mbx.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: aarch64-unknown-linux-musl
      - name: host packages for the unmodified x86 SDK
        run: |
          stamp() { printf '[%s] %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$*"; }
          trap 'status=$?; stamp "apt prerequisites finished: exit=$status"; exit "$status"' EXIT
          apt_options=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2)
          stamp 'apt update started'
          sudo apt-get "${apt_options[@]}" update
          stamp 'apt update completed; package installation started'
          sudo apt-get "${apt_options[@]}" install -y build-essential clang flex bison g++ gawk gcc-multilib gettext \
            libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file curl zstd
          stamp 'package installation completed'
      - name: cache pinned SDK download only
        uses: actions/cache@v4
        with:
          path: work/dl
          key: dnsmasq-target-sdk-${{ hashFiles('manifests/release-*.json') }}
      - name: validate PGO boundaries and compiler-warning gates
        run: python3 -m unittest discover -s tools -p 'test_ci_dnsmasq*.py'
      - name: build the explicitly frozen stage
        env:
          GH_TOKEN: ${{ github.token }}
          PGO_STAGE: ${{ inputs.stage }}
          PGO_SPEC: ${{ inputs.spec }}
        run: python3 tools/ci_check_dnsmasq_pgo_pipeline.py "$GITHUB_WORKSPACE/work" --stage "$PGO_STAGE" --spec "$PGO_SPEC"
      - name: preserve actual artifacts and original diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnsmasq-pgo-${{ inputs.stage }}-${{ github.sha }}-${{ github.run_id }}
          path: |
            work/out/dnsmasq/*.apk
            work/out/dnsmasq/dnsmasq-rs
            work/out/dnsmasq/*.log
            work/out/dnsmasq/*.json
            work/out/dnsmasq/source.tar
            work/out/dnsmasq/pgo/*
            work/out/dnsmasq/pgo-compilation/*
            work/out/dnsmasq/pgo-cargo
          if-no-files-found: error
          retention-days: 90
