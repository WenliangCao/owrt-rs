name: dnsmasq-pgo-candidate
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Explicit PGO build stage
        required: true
        default: frozen-use
        type: choice
        options: [frozen-use, generate, candidate-use]
      spec:
        description: Frozen manifest for the selected stage
        required: true
        default: manifests/dnsmasq-pgo-candidate-a97edbc1.json
        type: string

permissions:
  contents: read

concurrency:
  group: dnsmasq-pgo-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-build:
    if: github.ref == 'refs/heads/validation/dnsmasq-fork-pgo-a97edbc1-20261017'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: aarch64-unknown-linux-musl
      - name: host packages for the unmodified x86 SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib gettext \
            libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file curl zstd
      - name: cache pinned SDK download only
        uses: actions/cache@v4
        with:
          path: work/dl
          key: dnsmasq-target-sdk-ff4a38a397caa2cfe1c39e18f84ddede14878221b3593c3f2c4cfe24e3ec4c25
      - name: validate candidate identity, PGO and compiler-warning gates
        run: python3 -m unittest discover -s tools -p 'test_ci_dnsmasq*.py'
      - name: build the explicitly selected frozen stage
        env:
          GH_TOKEN: ${{ github.token }}
          PGO_STAGE: ${{ inputs.stage }}
          PGO_SPEC: ${{ inputs.spec }}
        run: python3 tools/ci_check_dnsmasq_pgo_pipeline.py "$GITHUB_WORKSPACE/work" --stage "$PGO_STAGE" --spec "$PGO_SPEC"
      - name: preserve actual candidate artifacts and every build diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnsmasq-pgo-a97edbc1-${{ inputs.stage }}-${{ github.sha }}-${{ github.run_id }}
          path: |
            work/out/dnsmasq/*.apk
            work/out/dnsmasq/dnsmasq-rs
            work/out/dnsmasq/*.log
            work/out/dnsmasq/*.json
            work/out/dnsmasq/source.tar
            work/out/dnsmasq/pgo/*
            work/out/dnsmasq/pgo-compilation/*
            work/out/dnsmasq/pgo-cargo
          if-no-files-found: error
          retention-days: 90
