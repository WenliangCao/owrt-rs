name: release-image
# Builds all eleven Rust programs with the official OpenWrt SDK, assembles one
# native owrt-control-plane APK and AX3000T sysupgrade image, then validates
# file ownership, stock recovery and execution-plane identity. The six legacy
# packages/image are build intermediates. Nothing is flashed: the image is an
# artifact (and a GitHub release when triggered by a v* tag).
on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt release (needs packaging/image/packages-<version>.txt)
        default: "25.12.5"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version || '25.12.5' }}
      OWRT_CORE_INCLUDE_ODHCPD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install verified mr-boxington
        run: sh tools/install_mbx.sh
      - name: rust toolchain (pinned by rust-toolchain.toml)
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: aarch64-unknown-linux-musl

      - name: host packages for the SDK / ImageBuilder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget zstd squashfs-tools \
            device-tree-compiler u-boot-tools

      - name: cache SDK and ImageBuilder downloads
        uses: actions/cache@v4
        with:
          path: work/dl
          key: openwrt-dl-${{ env.OPENWRT_VERSION }}

      - name: cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/mbx
          key: mbx-1.26.0-release-${{ hashFiles('components/*/Cargo.lock') }}

      - name: build apks and image
        run: sh tools/ci_build_image.sh "$GITHUB_WORKSPACE/work"

      - name: build standalone core components
        run: sh tools/ci_build_core.sh "$GITHUB_WORKSPACE/work"

      - name: build accepted dnsmasq with warnings-as-errors through its SDK recipe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s tools -p test_ci_dnsmasq_pgo.py
          python3 -m unittest discover -s tools -p test_native_image.py
          python3 tools/ci_build_dnsmasq.py "$GITHUB_WORKSPACE/work"

      - name: integrate eleven native components and verify the final image
        run: sh tools/ci_integrate_image.sh "$GITHUB_WORKSPACE/work"

      - name: summary
        run: |
          { echo '### Native eleven-component image for OpenWrt ${{ env.OPENWRT_VERSION }}'; echo; echo '```'; cat work/native/out/SHA256SUMS; echo '```'; echo; echo '#### shipped binaries'; echo '```'; cat work/native/out/binary-sha256.txt; echo '```'; echo; echo '```json'; cat work/native/out/manifest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: owrt-image-${{ env.OPENWRT_VERSION }}-${{ github.sha }}
          path: work/native/out/*
          if-no-files-found: error
          retention-days: 90

      - name: preserve failed build evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: owrt-image-failed-${{ github.sha }}
          path: |
            work/out/*.log
            work/out/*manifest.json
            work/out/dnsmasq/*.log
            work/out/dnsmasq/manifest.json
            work/out/dnsmasq/pgo-*.json
            work/out/dnsmasq/pgo-compilation/*
            work/native/*.log
            work/native/build-inputs.json
            work/native/bin/*-sysupgrade.bin
          retention-days: 90

      - name: github release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME} (OpenWrt ${OPENWRT_VERSION})" \
            --prerelease --latest=false \
            --notes "Build candidate from ${GITHUB_SHA}; hardware qualification is separate. See docs/RELEASE.md." \
            work/native/out/*.apk work/native/out/*-sysupgrade.bin work/native/out/SHA256SUMS \
            work/native/out/binary-sha256.txt work/native/out/manifest.json work/native/out/build-inputs.json \
            work/native/out/dnsmasq-build-manifest.json
