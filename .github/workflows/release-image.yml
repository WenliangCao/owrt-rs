name: release-image
# Builds the seven owrt-* apks with the official OpenWrt SDK and a
# xiaomi_mi-router-ax3000t sysupgrade image with the ImageBuilder, then
# validates the image content offline. Nothing is flashed: the image is an
# artifact (and a GitHub release when triggered by a v* tag).
on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt release (needs packaging/image/packages-<version>.txt)
        default: "25.12.5"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version || '25.12.5' }}
    steps:
      - uses: actions/checkout@v4

      - name: rust toolchain (pinned by rust-toolchain.toml)
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: aarch64-unknown-linux-musl

      - name: host packages for the SDK / ImageBuilder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget zstd squashfs-tools

      - name: cache SDK and ImageBuilder downloads
        uses: actions/cache@v4
        with:
          path: work/dl
          key: openwrt-dl-${{ env.OPENWRT_VERSION }}

      - name: cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-release-${{ hashFiles('components/*/Cargo.lock') }}

      - name: build apks and image
        run: sh tools/ci_build_image.sh "$GITHUB_WORKSPACE/work"

      - name: summary
        run: |
          { echo '### owrt-control-plane-rs image for OpenWrt ${{ env.OPENWRT_VERSION }}'; echo; echo '```'; cat work/out/SHA256SUMS; echo '```'; echo; echo '#### shipped binaries'; echo '```'; cat work/out/binary-sha256.txt; echo '```'; echo; echo '```json'; cat work/out/manifest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: owrt-image-${{ env.OPENWRT_VERSION }}-${{ github.sha }}
          path: |
            work/out/*.apk
            work/out/*-sysupgrade.bin
            work/out/SHA256SUMS
            work/out/binary-sha256.txt
            work/out/manifest.json
            work/out/*.log
          if-no-files-found: error
          retention-days: 90

      - name: github release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME} (OpenWrt ${OPENWRT_VERSION})" \
            --notes "Built by release-image from ${GITHUB_SHA}. Not flashed; see docs/RELEASE.md." \
            work/out/*.apk work/out/*-sysupgrade.bin work/out/SHA256SUMS work/out/binary-sha256.txt work/out/manifest.json
