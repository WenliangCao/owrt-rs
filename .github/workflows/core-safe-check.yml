name: core-safe-check
# Diagnostic candidates only. The dnsmasq pipeline and native release identity
# gates remain separate; this workflow never publishes or deploys an image.
on:
  workflow_dispatch:
  push:
    branches: [main, research/core-safe-20261017]
    paths:
      - "components/platform/**"
      - "components/ubus/**"
      - "components/uci/**"
      - "components/reload-config/**"
      - "components/logd/**"
      - "components/httpd/**"
      - "components/fw4/**"
      - "components/rpcd/**"
      - "components/ubusd/**"
      - "components/netifd/**"
      - "components/procd/**"
      - "packaging/openwrt/**"
      - "tools/ci_check_core.py"
      - "tools/ci_build_core.sh"
      - "tools/ci_build_image.sh"
      - "tools/dnsmasq/compiler_warnings.py"
      - "rust-toolchain.toml"
      - ".github/workflows/core-safe-check.yml"
  pull_request:
    paths:
      - "components/platform/**"
      - "components/ubus/**"
      - "components/uci/**"
      - "components/reload-config/**"
      - "components/logd/**"
      - "components/httpd/**"
      - "components/fw4/**"
      - "components/rpcd/**"
      - "components/ubusd/**"
      - "components/netifd/**"
      - "components/procd/**"
      - "packaging/openwrt/**"
      - "tools/ci_check_core.py"
      - "tools/ci_build_core.sh"
      - "tools/ci_build_image.sh"
      - "tools/dnsmasq/compiler_warnings.py"
      - "rust-toolchain.toml"
      - ".github/workflows/core-safe-check.yml"

permissions:
  contents: read

concurrency:
  group: core-safe-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: pinned Rust toolchain
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - name: existing component test prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcrypt-dev nftables iproute2 util-linux
      - uses: actions/cache/restore@v4
        id: host-registry
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: core-host-registry-${{ hashFiles('components/*/Cargo.lock') }}
      - name: compile every host target and run the existing component tests
        run: python3 tools/ci_check_core.py host "$GITHUB_WORKSPACE/work"
      - name: retain downloaded host dependencies after compile failures
        if: always() && steps.host-registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.host-registry.outputs.cache-primary-key }}
      - name: retain all host diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-host-${{ github.sha }}
          path: work/out/core-host/*
          if-no-files-found: error
          retention-days: 30

  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENWRT_VERSION: "25.12.5"
    steps:
      - uses: actions/checkout@v4
      - name: pinned Rust toolchain
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: aarch64-unknown-linux-musl
      - name: unmodified SDK and ImageBuilder prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget curl zstd squashfs-tools
      - uses: actions/cache/restore@v4
        id: sdk-downloads
        with:
          path: work/dl
          key: core-openwrt-dl-${{ env.OPENWRT_VERSION }}
      - uses: actions/cache/restore@v4
        id: target-registry
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: core-target-registry-${{ hashFiles('components/*/Cargo.lock') }}
      - name: verify the existing strict warning classifier
        env:
          PYTHONPATH: tools
        run: |
          python3 -m unittest \
            test_ci_dnsmasq_target.TargetCheckTests.test_all_rust_cargo_and_unknown_warning_forms_fail \
            test_ci_dnsmasq_target.TargetCheckTests.test_sdk_kconfig_warnings_are_retained_separately \
            test_ci_dnsmasq_target.TargetCheckTests.test_only_exact_sdk_openssl_configuration_message_is_exempt
      - name: build all nine through canonical recipes and check every router target
        run: python3 tools/ci_check_core.py target "$GITHUB_WORKSPACE/work"
      - name: retain checksum-verified SDK downloads after compile failures
        if: always() && steps.sdk-downloads.outputs.cache-hit != 'true' && hashFiles('work/out/sdk-downloads-verified') != ''
        uses: actions/cache/save@v4
        with:
          path: work/dl
          key: ${{ steps.sdk-downloads.outputs.cache-primary-key }}
      - name: retain downloaded target dependencies after compile failures
        if: always() && steps.target-registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.target-registry.outputs.cache-primary-key }}
      - name: retain candidates and original SDK diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-target-${{ github.sha }}
          path: |
            work/out/core-candidates/*
            work/out/core-binaries/*
            work/out/core-binaries.tar.gz
            work/out/*.apk
            work/out/*.log
            work/out/driver-*.txt
            work/out/*.json
            work/out/*sha256.txt
          if-no-files-found: error
          retention-days: 30
