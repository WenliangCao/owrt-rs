name: repro-diag
# Diagnostic build for the httpd/ring reproducibility question: build only
# owrt-httpd's cargo step and upload the intermediates, so the first artifact
# that differs between CI and the build host can be identified instead of
# guessed. Manual dispatch only; produces no release artifact.
on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        default: "25.12.5"
      cc_map:
        description: "none or cargo_home (E1's single factor, target CC)"
        default: "none"
      rustc_map:
        description: "none or target_dir (E2's single factor, rustc)"
        default: "none"
      mode:
        description: "build (full httpd) or minimal (dependency-free fixture)"
        default: "build"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version || '25.12.5' }}
    steps:
      - uses: actions/checkout@v4

      - name: rust toolchain (pinned by rust-toolchain.toml)
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: aarch64-unknown-linux-musl

      - name: host packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential zstd file

      - name: cache SDK download
        uses: actions/cache@v4
        with:
          path: work/dl
          key: openwrt-dl-${{ env.OPENWRT_VERSION }}

      - name: fetch SDK
        run: sh tools/repro_diag.sh fetch "$GITHUB_WORKSPACE/work"

      - name: diagnostic build
        env:
          REPRO_CC_MAP: ${{ github.event.inputs.cc_map || 'none' }}
          REPRO_RUSTC_MAP: ${{ github.event.inputs.rustc_map || 'none' }}
        run: sh tools/repro_diag.sh "${{ github.event.inputs.mode || 'build' }}" "$GITHUB_WORKSPACE/work"

      - uses: actions/upload-artifact@v4
        with:
          name: repro-diag-ci-${{ github.event.inputs.mode || 'build' }}-cc${{ github.event.inputs.cc_map || 'none' }}-rustc${{ github.event.inputs.rustc_map || 'none' }}-${{ github.sha }}
          path: |
            work/diag/**
            work/minimal/**
