name: ci
on:
  push:
    branches: [main]
    tags: ["research-netifd-*"]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rust toolchain (pinned by rust-toolchain.toml)
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt
      - name: host deps (rpcd, fw4 and dnsmasq namespace tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcrypt-dev nftables iproute2 util-linux
      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            components/*/target
          key: cargo-${{ runner.os }}-${{ steps.rust.outputs.channel }}-${{ hashFiles('components/*/Cargo.lock') }}
      - name: host components and shared platform reject every compiler warning
        run: python3 tools/ci_check_core.py host "$GITHUB_WORKSPACE/work"
      - name: preserve host warning and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-host-${{ github.sha }}
          path: work/out/core-host/*
          if-no-files-found: warn
          retention-days: 30
      - name: compile dnsmasq tests with warnings-as-errors
        run: RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-Dwarnings" CARGO_INCREMENTAL=${CARGO_INCREMENTAL:-0} cargo test --quiet --locked --manifest-path components/dnsmasq/Cargo.toml --no-run
      - name: dnsmasq tests with warnings-as-errors in private Linux namespaces
        run: |
          dnsmasq_tmp=$(mktemp -d "$RUNNER_TEMP/dnsmasq-tests.XXXXXX")
          trap 'sudo -n rm -rf -- "$dnsmasq_tmp"' EXIT
          # The DNS bin tests change process-global signal state and loopback
          # aliases. Serialize this crate and create real namespaces; a marker
          # alone must never authorize those operations on the host network.
          sudo -n env "PATH=$PATH" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            "RUSTUP_TOOLCHAIN=${{ steps.rust.outputs.channel }}" \
            "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-Dwarnings" \
            "CARGO_INCREMENTAL=${CARGO_INCREMENTAL:-0}" "TMPDIR=$dnsmasq_tmp" \
            sh tools/dnsmasq/run_isolated.sh \
            cargo test --quiet --locked --offline \
              --manifest-path "$GITHUB_WORKSPACE/components/dnsmasq/Cargo.toml" \
              -- --test-threads=1
      - run: make check-toolchain
      - run: make check-toolchain-negative
      - run: make check-tools
      - run: make check-harnesses
      - run: make check-benchmark
