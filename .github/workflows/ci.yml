name: ci
on:
  push:
    branches: [main]
    tags: ["research-netifd-*"]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rust toolchain (pinned by rust-toolchain.toml)
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt
      - name: host deps (libcrypt for rpcd session tests, nft for fw4 tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcrypt-dev nftables
      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            components/*/target
          key: cargo-${{ runner.os }}-${{ steps.rust.outputs.channel }}-${{ hashFiles('components/*/Cargo.lock') }}
      - run: make test
      - run: make check-toolchain
      - run: make check-toolchain-negative
      - run: make check-tools
      - run: make check-harnesses
      - run: make check-benchmark
