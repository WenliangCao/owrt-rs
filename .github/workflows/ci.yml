name: ci
on:
  push:
    branches: [main, ci/audit110-r3]
    tags: ["research-netifd-*"]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Release input tests archive the exact frozen product revisions.
          fetch-depth: 0
      - name: rust toolchain (pinned by rust-toolchain.toml)
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
      - name: install verified huacnlee/cargo
        run: sh tools/install_cargo.sh
      - name: host deps (rpcd, fw4 and dnsmasq namespace tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcrypt-dev nftables iproute2 util-linux
      - name: cache shared Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/targets
          key: cargo-0.103.0-1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.channel }}-${{ hashFiles('components/**/Cargo.lock', 'tools/benchmark/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-0.103.0-1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.channel }}-${{ hashFiles('components/**/Cargo.lock', 'tools/benchmark/Cargo.lock') }}-
      - name: default and feature tests, isolated process tests, examples and Clippy
        run: make test check-rust fmt-check check-benchmark
      - name: preserve host warning and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-host-${{ github.sha }}
          path: work/out/rust-host/*
          if-no-files-found: warn
          retention-days: 30
      - run: make check-toolchain
      - run: make check-toolchain-negative
      - run: make check-tools
      - run: make check-harnesses
